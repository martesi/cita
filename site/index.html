<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Render a compact Cita reference." />
    <title>Cita</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./"><span class="brand-icon" aria-hidden="true"></span>cita</a>
        <a class="muted" href="./create/">create</a>
      </header>

      <section class="panel" id="reader" hidden>
        <div class="toolbar">
          <span id="meta"></span>
          <button id="copy-text" type="button">Copy text</button>
          <button id="copy-link" type="button">Copy citation</button>
        </div>
        <article id="content"></article>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./render.js"></script>
  </body>
</html>
