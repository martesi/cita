<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Cita</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(44rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 12vh 0 4rem;
      }
      #content {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main><article id="content"></article></main>
    <script>
      const params = new URLSearchParams(location.search)
      const content = params.get('q') ?? params.get('content') ?? ''
      document.querySelector('#content').textContent = content || 'Nothing to display.'
    </script>
  </body>
</html>
