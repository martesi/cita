<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Read or create a compact Cita reference." />
    <title>Cita</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="../">cita</a>
        <span class="muted">compact references</span>
      </header>

      <section class="panel" id="reader" hidden>
        <div class="toolbar">
          <span id="meta"></span>
          <button id="copy-text" type="button">Copy text</button>
          <button id="copy-link" type="button">Copy citation</button>
          <button id="edit" type="button">Edit</button>
          <button id="new" type="button">New</button>
        </div>
        <article id="content"></article>
      </section>

      <section class="panel editor" id="editor" hidden>
        <textarea
          id="input"
          aria-label="Reference content"
          placeholder="Paste the content you want to keep out of the main answer…"
        ></textarea>
        <div class="editor-actions">
          <label>
            <span class="muted">Encoding</span>
            <select id="algo">
              <option value="auto" selected>Auto</option>
              <option value="plain">Plain URL</option>
              <option value="gzip">Gzip</option>
              <option value="br">Brotli</option>
            </select>
          </label>
          <button class="primary" id="generate" type="button">Generate citation</button>
        </div>
        <span class="muted">⌘/Ctrl + Enter to generate</span>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="../app.js"></script>
  </body>
</html>
